name: GitHub Actions Build Test
permissions:
  contents: read
on:
  push:
    branches:
        - master
  pull_request:
    branches:
        - master
jobs:
  cppcheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - run: echo "This job was triggered by a ${{ github.event_name }} event."
    - name: Checkout Repo
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: install dependencies
      run: |
        sudo apt-get -y update && sudo apt-get install -y cppcheck && \
        cppcheck . --force --inline-suppr
  build-test-ubuntu-ish:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: install dependencies
      run: |
        sudo apt-get -y update && sudo apt-get install -y build-essential
    - name: build
      run: |
        ./configure && make && make check
    - name: test commands
      run: |
        timeout 300 src/iperf3 -s &
        ./test_commands.sh localhost
    - name: test auth
      run: |
        pkill iperf3
        ./auth_test.sh
  build-test-macos-ish:
    strategy:
      matrix:
        os: [macos-15, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: install dependencies
      run: |
        brew install coreutils
    - name: build
      run: |
        ./configure && make && make check
    - name: test commands
      run: |
        timeout 300 src/iperf3 -s &
        ./test_commands.sh localhost
    - name: test auth
      run: |
        pkill iperf3
        ./auth_test.sh
  build-test-sanitizer-address:
    runs-on: ubuntu-latest
    steps:
    - run: echo "Running address sanitzer"
    - name: Checkout Repo
      uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: install dependencies
      run: |
        sudo apt-get -y update && sudo apt-get install -y build-essential
    - name: build
      run: |
        set -e
        ./configure CFLAGS="-g -O0 -fsanitize=address" LDFLAGS="-fsanitize=address"
        make
        if ! make check; then
          cat src/test-suite.log 2>/dev/null || true
          cat src/t_api.log 2>/dev/null || true
          exit 1
        fi
    - name: test commands
      run: |
        timeout 300 src/iperf3 -s &
        ./test_commands.sh localhost
    - name: test auth
      run: |
        pkill iperf3
        ./auth_test.sh

  build-test-windows-ucrt64:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: false
        install: >-
          base-devel
          mingw-w64-ucrt-x86_64-gcc
          autoconf
          automake
          libtool
    - name: build and unit tests
      shell: msys2 {0}
      run: |
        set -euxo pipefail
        CFLAGS='-g -O2 -Wall -Werror=format' ./configure --without-openssl --without-sctp --without-ldconfig --disable-shared --enable-static
        ! grep -q '^#define HAVE_CLOCK_NANOSLEEP 1' src/iperf_config.h
        make V=1 -j2
        make check
        rm -rf stage
        make install DESTDIR="$PWD/stage"
        include_dir="$(dirname "$(find "$PWD/stage" -type f -name iperf_api.h -print -quit)")"
        test -n "$include_dir"
        test -f "$include_dir/iperf_socket.h"
        test ! -f "$include_dir/iperf_socket_internal.h"
        printf '#include <iperf_api.h>\nint main(void) { return 0; }\n' > installed-header-smoke.c
        gcc -I"$include_dir" -c installed-header-smoke.c -o installed-header-smoke.o
    - name: TCP and UDP loopback
      shell: msys2 {0}
      run: |
        set -euxo pipefail
        run_case() {
          port="$1"
          shift
          timeout 45 src/iperf3.exe -s -1 -p "$port" &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 1
          timeout 20 "$@"
          wait "$server_pid"
          trap - EXIT
        }
        run_case 6201 src/iperf3.exe -c 127.0.0.1 -p 6201 -t 1
        run_case 6202 src/iperf3.exe -c 127.0.0.1 -u -b 10M -p 6202 -t 1
        run_case 6204 src/iperf3.exe -c 127.0.0.1 -u -b 10M -R -p 6204 -t 1
        run_case 6205 src/iperf3.exe -c 127.0.0.1 -u -b 10M --bidir -p 6205 -t 1
        run_case 6210 src/iperf3.exe -c 127.0.0.1 -u -b 10M -P 4 -p 6210 -t 1
    - name: parallel and lifecycle stress
      shell: msys2 {0}
      run: |
        set -euxo pipefail
        timeout 90 src/iperf3.exe -s -1 -p 6203 >tcp80-server.log 2>&1 &
        server_pid=$!
        trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
        sleep 1
        if ! timeout 60 src/iperf3.exe -c 127.0.0.1 -p 6203 -P 80 -b 10M -t 1 >tcp80-client.log 2>&1; then
          cat tcp80-client.log
          cat tcp80-server.log
          exit 1
        fi
        if ! wait "$server_pid"; then
          cat tcp80-client.log
          cat tcp80-server.log
          exit 1
        fi
        trap - EXIT
        modes=('' '-R' '--bidir' '' '')
        for i in 0 1 2 3 4; do
          port=$((6300 + i))
          server_log="lifecycle-${port}-server.log"
          client_log="lifecycle-${port}-client.log"
          timeout 60 src/iperf3.exe -s -1 -p "$port" >"$server_log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          if [[ -n "${modes[$i]}" ]]; then
            if ! timeout 30 src/iperf3.exe -c 127.0.0.1 -p "$port" -P 4 -b 10M -t 1 "${modes[$i]}" >"$client_log" 2>&1; then
              cat "$client_log"
              cat "$server_log"
              exit 1
            fi
          else
            if ! timeout 30 src/iperf3.exe -c 127.0.0.1 -p "$port" -P 4 -b 10M -t 1 >"$client_log" 2>&1; then
              cat "$client_log"
              cat "$server_log"
              exit 1
            fi
          fi
          if ! wait "$server_pid"; then
            cat "$client_log"
            cat "$server_log"
            exit 1
          fi
          trap - EXIT
        done
    - name: server duration rejection
      shell: msys2 {0}
      run: |
        set -euxo pipefail
        timeout 30 src/iperf3.exe -s -1 -p 6400 --server-max-duration 2 >server-duration.log 2>&1 &
        server_pid=$!
        trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
        sleep 1
        set +e
        timeout 20 src/iperf3.exe -c 127.0.0.1 -p 6400 -t 10 >client-duration.log 2>&1
        client_rc=$?
        wait "$server_pid"
        server_rc=$?
        set -e
        trap - EXIT
        test "$client_rc" -eq 1
        test "$server_rc" -eq 0
        grep -Fq "client's requested duration exceeds the server's maximum permitted limit" server-duration.log
        grep -Fq "client's requested duration exceeds the server's maximum permitted limit" client-duration.log

  build-test-windows-ucrt64-openssl:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: false
        install: >-
          base-devel
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-openssl
          autoconf
          automake
          libtool
    - name: OpenSSL build and authentication tests
      shell: msys2 {0}
      run: |
        set -euxo pipefail
        CFLAGS='-g -O2 -Wall -Werror=format' ./configure --with-openssl=/ucrt64 --without-sctp --without-ldconfig --disable-shared --enable-static
        grep -q '^#define HAVE_SSL 1' src/iperf_config.h
        make V=1 -j2
        make check
        (cd src && ./t_auth.exe)
