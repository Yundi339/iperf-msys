name: GitHub Actions Build Test
permissions:
  contents: read
on:
  push:
    branches:
        - master
  pull_request:
    branches:
        - master
jobs:
  cppcheck-test:
    runs-on: ubuntu-latest
    steps:
    - run: echo "This job was triggered by a ${{ github.event_name }} event."
    - name: Checkout Repo
      uses: actions/checkout@v5
    - name: install dependencies
      run: |
        sudo apt-get -y update && sudo apt-get install -y cppcheck && \
        cppcheck . --force --inline-suppr
  build-test-ubuntu-ish:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - name: install dependencies
      run: |
        sudo apt-get -y update && sudo apt-get install -y build-essential
    - name: build
      run: |
        set -e
        
        # 设置环境变量
        export PATH="/ucrt64/bin:$PATH"
        export PKG_CONFIG_PATH="/ucrt64/lib/pkgconfig"
        export CC="gcc"
        export CXX="g++"
        
        # 生成configure脚本
        ./bootstrap.sh
        
        # 配置构建 - 静态编译
        ./configure \
          --prefix=/ucrt64 \
          --host=x86_64-w64-mingw32 \
          --build=x86_64-w64-mingw32 \
          --disable-shared \
          --enable-static \
          CFLAGS="-O2 -g -pipe -Wall -Wp,-D_FORTIFY_SOURCE=2 -fexceptions --param=ssp-buffer-size=4" \
          CXXFLAGS="-O2 -g -pipe -Wall -Wp,-D_FORTIFY_SOURCE=2 -fexceptions --param=ssp-buffer-size=4" \
          LDFLAGS="-static -Wl,--enable-auto-import -Wl,--enable-runtime-pseudo-reloc" \
          LIBS="-lssl -lcrypto -lpthread -lws2_32 -lcrypt32" \
          PKG_CONFIG_PATH="/ucrt64/lib/pkgconfig"
        
        # 编译
        make -j$(nproc)
        
        # 运行测试
        make check
        
        # 测试iperf3服务器
        timeout 300 src/iperf3.exe -s &
        sleep 5
        ./test_commands.sh localhost
  build-test-macos-ish:
    strategy:
      matrix:
        os: [macos-15, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - name: install dependencies
      run: |
        brew install coreutils
    - name: build
      run: |
        ./configure && make && make check
        timeout 300 src/iperf3 -s &
        ./test_commands.sh localhost
  build-test-sanitizer-address:
    runs-on: ubuntu-latest
    steps:
    - run: echo "Running address sanitzer"
    - name: Checkout Repo
      uses: actions/checkout@v5
    - name: install dependencies
      run: |
        sudo apt-get -y update && sudo apt-get install -y build-essential
    - name: build
      run: |
        ./configure CFLAGS="-g -O0 -fsanitize=address" LDFLAGS="-fsanitize=address" && make && make check
        timeout 300 src/iperf3 -s &
        ./test_commands.sh localhost
