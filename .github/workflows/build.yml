name: Build and Release

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  setup_release:
    name: Setup Release
    outputs:
      publish_release: ${{ steps.setup_release_auto.outputs.publish_release || steps.setup_release_manual.outputs.publish_release }}
      release_body: ${{ steps.setup_release_auto.outputs.release_body || steps.setup_release_manual.outputs.release_body }}
      release_commit: ${{ steps.setup_release_auto.outputs.release_commit || steps.setup_release_manual.outputs.release_commit }}
      release_generate_release_notes: ${{ steps.setup_release_auto.outputs.release_generate_release_notes || steps.setup_release_manual.outputs.release_generate_release_notes }}
      release_tag: ${{ steps.setup_release_auto.outputs.release_tag || steps.setup_release_manual.outputs.release_tag }}
      release_version: ${{ steps.setup_release_auto.outputs.release_version || steps.setup_release_manual.outputs.release_version }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Release (Auto)
        id: setup_release_auto
        if: github.event_name != 'workflow_dispatch'
        uses: LizardByte/setup-release-action@v2025.426.225
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Release (Manual)
        id: setup_release_manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          # 为手动构建设置默认值
          echo "publish_release=false" >> $GITHUB_OUTPUT
          echo "release_body=Manual build" >> $GITHUB_OUTPUT
          echo "release_commit=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "release_generate_release_notes=false" >> $GITHUB_OUTPUT
          echo "release_tag=manual-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          echo "release_version=manual-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

  build_win:
    name: Windows UCRT
    needs: setup_release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Dependencies Windows
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-ca-certificates
            autoconf
            automake
            libtool
            pkg-config

      - name: Verify Build Tools
        shell: msys2 {0}
        run: |
          echo "Verifying build tools are installed..."
          which gcc || (echo "gcc not found" && exit 1)
          which autoconf || (echo "autoconf not found" && exit 1)
          which automake || (echo "automake not found" && exit 1)
          which libtool || (echo "libtool not found" && exit 1)
          echo "All build tools verified successfully"
          
          echo "=== OpenSSL 诊断信息 ==="
          echo "OpenSSL版本: $(openssl version)"
          echo "OpenSSL路径: $(which openssl)"
          echo "库路径检查:"
          find /ucrt64 -name "*ssl*" -o -name "*crypto*" | head -10
          echo "环境变量:"
          echo "  PATH: $PATH"
          echo "  LD_LIBRARY_PATH: ${LD_LIBRARY_PATH:-未设置}"

      - name: Build Windows UCRT
        shell: msys2 {0}
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BUILD_VERSION: ${{ needs.setup_release.outputs.release_tag }}
          COMMIT: ${{ needs.setup_release.outputs.release_commit }}
          LD_LIBRARY_PATH: "/ucrt64/lib"
          PKG_CONFIG_PATH: "/ucrt64/lib/pkgconfig"
        run: |
          set -e
          
          # 设置环境变量
          export PATH="/ucrt64/bin:$PATH"
          export PKG_CONFIG_PATH="/ucrt64/lib/pkgconfig"
          export CC="gcc"
          export CXX="g++"
          
          # 生成configure脚本
          echo "=== 运行 bootstrap.sh ==="
          ./bootstrap.sh || (echo "bootstrap.sh 失败" && exit 1)
          
          # OpenSSL 配置检查
          echo "=== OpenSSL 配置检查 ==="
          pkg-config --exists openssl && echo "OpenSSL pkg-config 可用" || echo "OpenSSL pkg-config 不可用"
          pkg-config --cflags openssl
          pkg-config --libs openssl
          
          # 检查configure脚本是否存在
          if [ ! -f "./configure" ]; then
            echo "错误: configure脚本未生成"
            exit 1
          fi
          
          # 配置构建 - 静态编译
          echo "=== 运行 configure ==="
          ./configure \
            --prefix=/ucrt64 \
            --host=x86_64-w64-mingw32 \
            --build=x86_64-w64-mingw32 \
            --disable-shared \
            --enable-static \
            --with-openssl=/ucrt64 \
            CPPFLAGS="-I/ucrt64/include" \
            CFLAGS="-O2 -g -pipe -Wall -Wp,-D_FORTIFY_SOURCE=2 -fexceptions --param=ssp-buffer-size=4" \
            CXXFLAGS="-O2 -g -pipe -Wall -Wp,-D_FORTIFY_SOURCE=2 -fexceptions --param=ssp-buffer-size=4" \
            LDFLAGS="-static -L/ucrt64/lib -Wl,--enable-auto-import -Wl,--enable-runtime-pseudo-reloc" \
            LIBS="-lssl -lcrypto -lpthread -lws2_32 -lcrypt32" \
            PKG_CONFIG_PATH="/ucrt64/lib/pkgconfig" || (echo "configure 失败" && exit 1)
          
          # 编译
          echo "=== 开始编译 ==="
          make -j$(nproc) || (echo "编译失败" && exit 1)
          
          # 设置测试环境
          export LD_LIBRARY_PATH="/ucrt64/lib:$LD_LIBRARY_PATH"
          export PATH="/ucrt64/bin:$PATH"
          
          # 运行测试
          echo "=== 开始测试 ==="
          make check || (echo "测试失败" && exit 1)

      - name: Package Windows UCRT
        shell: msys2 {0}
        run: |
          mkdir -p artifacts
          
          # 创建发布目录
          mkdir -p release
          
          # 复制可执行文件
          cp src/iperf3.exe release/
          cp src/.libs/libiperf.a release/
          
          # 复制文档
          cp README.md README_cn.md release/
          cp LICENSE release/
          
          # 创建压缩包
          cd release
          tar -czf ../artifacts/iperf3-msys2-windows-ucrt.tar.gz *

      - name: Generate Checksums
        shell: pwsh
        run: |
          # 生成 SHA256 校验和
          Get-ChildItem -Path "artifacts" -File | ForEach-Object {
            $hash = Get-FileHash -Path $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)" | Out-File -FilePath "artifacts/SHA256SUMS.txt" -Append -Encoding UTF8
          }

      - name: Rename release assets
        shell: msys2 {0}
        run: |
          # 获取项目版本号
          PROJECT_VERSION=$(grep "AC_INIT" configure.ac | sed 's/.*\[.*\],\[\([^]]*\)\].*/\1/')
          TAG="${{ needs.setup_release.outputs.release_tag }}"
          
          # 格式化标签为 vYEAR.DATE 格式
          NEWTAG="$TAG"
          if [[ "$TAG" =~ ^v([0-9]{4})\.([0-9]+) ]]; then
            YEAR="${BASH_REMATCH[1]}"
            DATE_PART="${BASH_REMATCH[2]}"
            DATE_PADDED=$(printf "%04d" "$DATE_PART")
            NEWTAG="v${YEAR}.${DATE_PADDED}"
          fi
          
          # 重命名文件，包含项目版本和标签
          mv artifacts/iperf3-msys2-windows-ucrt.tar.gz "artifacts/iperf3-msys2-${PROJECT_VERSION}-${NEWTAG}-windows-ucrt.tar.gz"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iperf3-msys2-windows
          path: |
            artifacts/iperf3-msys2-*-windows-ucrt.tar.gz
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create/Update GitHub Release
        if: needs.setup_release.outputs.publish_release == 'true'
        uses: LizardByte/create-release-action@v2025.426.1549
        with:
          allowUpdates: true
          body: |
            ## iperf3-msys2 Windows UCRT Release
            
            This release provides a Windows UCRT-optimized version of iperf3.
            
            ### Features
            - UCRT compatibility for Windows environments
            - Static compilation for easy deployment
            - Enhanced stability for UCRT environments
            - Source code integration support
            
            ### Installation
            1. Download the appropriate archive for your system
            2. Extract the files
            3. Run `iperf3.exe` directly
            
            ### Building from Source
            See the README files for detailed build instructions.
          generateReleaseNotes: ${{ needs.setup_release.outputs.release_generate_release_notes }}
          name: ${{ needs.setup_release.outputs.release_tag }}
          prerelease: true
          tag: ${{ needs.setup_release.outputs.release_tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
